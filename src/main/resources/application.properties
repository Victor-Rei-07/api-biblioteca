spring.application.name=demo

# Dados de conexão do banco
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
api.security.token.secret=${JWT_SECRET}

# Configurações do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Libera os endpoints do Actuator na web
management.endpoints.web.exposure.include=metrics,prometheus

# Ativa o cálculo de percentis (p50, p95, p99) para todas as requisições HTTP
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles[http.server.requests]=0.5,0.95,0.99

spring.data.redis.host=localhost
spring.data.redis.port=6379
# Tempo padrão de vida do cache (TTL) - Exemplo: 10 minutos (em milissegundos)
spring.cache.redis.time-to-live=600000
cache-null-values: false

# Em desenvolvimento
cors.allowed-origins=http://localhost:3000

# Em produção (exemplo)
# cors.allowed-origins=https://meudominio.com,https://app.meudominio.com

logging.level.org.springframework.security=DEBUG
# Força o Springdoc a não usar cache para a documentação e interface
springdoc.cache.disabled=true

# Força a reinicialização automática para arquivos modificados na pasta classpath
spring.devtools.restart.enabled=true

#Faz persistir o access token no swagger 
springdoc.swagger-ui.persist-authorization=true

# Flyway Configuration
spring.flyway.baseline-on-migrate=true

# Caso queira atualização manual
spring.flyway.enabled=false